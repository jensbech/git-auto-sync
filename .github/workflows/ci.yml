name: CI

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      EMAIL: test@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Setup Git Identity
        run: |
          git config --global user.email "test@example.com"
          git config --global user.name "GitHub CI"
      - name: Check formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - run: go vet ./...
      - run: go test -race ./...
      - name: Cross-compile
        run: |
          GOOS=linux go build ./...
          GOOS=windows go build ./...
      - name: Fuzz the socket protocol
        if: matrix.os == 'ubuntu-latest'
        run: |
          go test ./common -run '^$' -fuzz '^FuzzReadLine$' -fuzztime 10s
          go test ./common -run '^$' -fuzz '^FuzzDecodeAndDispatch$' -fuzztime 10s
          go test ./daemon -run '^$' -fuzz '^FuzzHandleCommand$' -fuzztime 10s

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15

  app:
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build menu bar app
        working-directory: macos/GitAutoSyncMenuBar
        run: swift build -c release
